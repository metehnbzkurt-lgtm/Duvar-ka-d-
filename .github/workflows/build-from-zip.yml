name: Build APK from zip

on:
  push:
    paths: ['*.zip']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip'i aç
        run: |
          ZIP=$(ls -t *.zip | head -n 1)
          mkdir -p /tmp/proj
          unzip -q "$ZIP" -d /tmp/proj
          SETTINGS=$(find /tmp/proj -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "Zip içinde settings.gradle.kts bulunamadı"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: APK derle
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BingDuvarKagidi-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
